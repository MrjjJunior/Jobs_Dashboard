services:
  postgres:
    image: postgres:16-alpine
    container_name: jobs_dashboard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobs_dashboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobs_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-jobs_dashboard
    environment:
      PGADMIN_DEFAULT_EMAIL: tstlhjhb025@student.wethinkcode.co.za
      PGADMIN_DEFAULT_PASSWORD: job_d@shb0ard 
    ports:
      - "5050:80"
volumes:
  postgres_data:
